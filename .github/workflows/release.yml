name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, test and pack without staging anything
        type: boolean
        default: true

permissions: {}

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - name: Install the Glitch server
        run: npm run glitch:install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        run: npm run test:e2e --workspace glitch-playwright

      - name: Verify published contents
        run: node scripts/verify-package.mjs

      # Fails when every manifest version is already on the registry, so a tag
      # that would release nothing stops here instead of succeeding silently.
      - name: Show the release plan
        run: node scripts/release-plan.mjs

  stage:
    name: Stage on npm
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry-run
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/glitch-playwright
    permissions:
      contents: read
      # Lets npm attach a provenance attestation tying the tarball to this run.
      id-token: write
    outputs:
      staged: ${{ steps.stage.outputs.staged }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm stage arrived in npm 12, and Node 22 still bundles npm 10.
      - name: Use an npm that can stage
        run: |
          npm install -g npm@12
          npm --version

      - run: npm ci

      - run: npm run build

      - name: Stage
        id: stage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is empty. Add it as a secret on the 'npm' environment" >&2
            echo "(Settings > Environments > npm > Environment secrets), or as a" >&2
            echo "repository secret. The name must be exactly NPM_TOKEN." >&2
            exit 1
          fi

          names=$(node scripts/release-plan.mjs --names)
          specs=$(node scripts/release-plan.mjs --specs | tr '\n' ' ')

          for name in $names; do
            echo "::group::stage $name"
            npm stage publish --workspace "$name"
            echo "::endgroup::"
          done

          echo "staged=$specs" >> "$GITHUB_OUTPUT"

          {
            echo "### Staged, pending approval"
            echo
            for spec in $specs; do
              echo "- $spec"
            done
            echo
            echo "Nothing is installable until a maintainer promotes it:"
            echo
            echo "    npm stage list"
            echo "    npm stage approve <stage-id>"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Draft the GitHub release
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          STAGED: ${{ needs.stage.outputs.staged }}
        run: |
          set -euo pipefail

          notes=$(mktemp)
          {
            echo "### Staged"
            echo
            for spec in $STAGED; do
              name=${spec%@*}
              version=${spec##*@}
              echo "- [$spec](https://www.npmjs.com/package/$name/v/$version)"
            done
            echo
            echo "Promote them on npm, then publish this draft:"
            echo
            echo "    npm stage list"
            echo "    npm stage approve <stage-id>"
            echo
            echo "Packages not listed were unchanged and keep their current version."
          } > "$notes"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --draft \
            --generate-notes \
            --notes-file "$notes" \
            --verify-tag
