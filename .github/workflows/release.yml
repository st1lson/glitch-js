name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, test and pack without publishing anything
        type: boolean
        default: true

permissions: {}

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - name: Install the Glitch server
        run: npm run glitch:install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        run: npm run test:e2e --workspace glitch-playwright

      - name: Verify published contents
        run: node scripts/verify-package.mjs

      # Fails when every manifest version is already on the registry, so a tag
      # that would publish nothing stops here instead of succeeding silently.
      - name: Show the release plan
        run: node scripts/release-plan.mjs

  publish:
    name: Publish to npm
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry-run
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/glitch-playwright
    permissions:
      contents: read
      # Lets npm attach a provenance attestation tying the tarball to this run.
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      # Only packages whose version is not yet on the registry, in dependency
      # order so nothing ships before something it depends on. The plan is read
      # before the first publish, because afterwards every package looks done.
      - name: Publish
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          names=$(node scripts/release-plan.mjs --names)
          specs=$(node scripts/release-plan.mjs --specs | tr '\n' ' ')

          for name in $names; do
            echo "::group::publish $name"
            npm publish --workspace "$name"
            echo "::endgroup::"
          done

          echo "published=$specs" >> "$GITHUB_OUTPUT"
          echo "Published: $specs" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          set -euo pipefail

          notes=$(mktemp)
          {
            echo "### Published"
            echo
            for spec in $PUBLISHED; do
              name=${spec%@*}
              version=${spec##*@}
              echo "- [\`$spec\`](https://www.npmjs.com/package/$name/v/$version)"
            done
            echo
            echo "Packages not listed were unchanged and keep their current version."
          } > "$notes"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --notes-file "$notes" \
            --verify-tag
