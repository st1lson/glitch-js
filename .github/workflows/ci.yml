name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # biome ci checks formatting and lint without writing, and annotates the
      # pull request rather than only failing.
      - run: npx biome ci --reporter=github .

  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['20.11', '22', '24']

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

  integration:
    name: Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - run: npm ci

      - run: npm run build

      # The suite drives a real Glitch server rather than a stub, so a schema
      # change on the Go side fails here instead of shipping.
      - name: Install the Glitch server
        run: npm run glitch:install

      # Chromium only. The suite exercises the fixtures, not cross-browser
      # rendering, and the other engines triple the download.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        run: npm run test:e2e --workspace glitch-playwright

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/playwright/playwright-report
          retention-days: 7

  package:
    name: Verify published contents
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      # Packs each tarball and imports it as a consumer would, so a broken
      # exports map or a missing file fails here rather than after a release.
      - name: Pack and import each package
        run: node scripts/verify-package.mjs

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high
