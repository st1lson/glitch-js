name: Feature request
description: Suggest a capability these packages should have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to test that you cannot today
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What the API might look like
      render: ts

  - type: textarea
    id: alternatives
    attributes:
      label: What you are doing instead right now
